<style>
:root{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--dim:#64748b;--accent:#3b82f6;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;overflow-x:hidden}
html{overflow-x:hidden}
/* ═══ Header ═══ */
.app-header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:linear-gradient(135deg,#1e293b,#0f172a);border-bottom:1px solid var(--border)}
.header-brand{display:flex;align-items:center;gap:12px}
.header-brand img{height:32px;border-radius:6px}
.header-brand h1{font-size:18px;font-weight:700;color:#f8fafc;letter-spacing:-0.5px}
.header-brand .sub{font-size:11px;color:var(--dim);margin-top:1px}
.header-right{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--dim)}
.header-right .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* ═══ Stats Row ═══ */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 24px;max-width:1400px;margin:0 auto}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;display:flex;flex-direction:column;gap:4px;position:relative;transition:all .2s ease}
.stat-card[onclick]:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(59,130,246,.15);transform:translateY(-1px)}
.stat-card[onclick]:active{transform:translateY(0);box-shadow:none}
.stat-card[onclick]::after{content:'›';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--dim);opacity:.4;transition:opacity .2s}
.stat-card[onclick]:hover::after{opacity:1;color:var(--accent)}
.stat-card .stat-value{font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1;transition:opacity .4s ease}
.stat-card.loading .stat-value{opacity:.3}
.stat-card .stat-label{font-size:12px;color:var(--dim)}
.stat-card.accent .stat-value{color:var(--accent)}
.stat-card.green .stat-value{color:var(--green)}
.stat-card.amber .stat-value{color:var(--amber)}
/* ═══ Filter Bar ═══ */
.filter-bar{max-width:1400px;margin:0 auto;padding:0 24px 12px}
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.filter-row:last-child{margin-bottom:0}
/* ── Desktop: single-row compact filter bar (all inline) ── */
@media(min-width:769px){
  .filter-bar{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;overflow-x:auto}
  .search-row{flex-shrink:0}
  .search-box{display:flex;align-items:center;flex:1.2;min-width:240px;max-width:400px;position:relative}
  .search-box input{flex:1;height:36px;box-sizing:border-box;border-radius:6px 0 0 6px;padding:8px 12px 8px 34px;font-size:13px}
  .search-btn{height:36px;flex-shrink:0;padding:0 16px;border-radius:0 6px 6px 0;border:1px solid var(--border);border-left:none;background:var(--accent);color:#fff;cursor:pointer;font-size:13px;white-space:nowrap}
  .search-btn:hover{background:#2563eb}
  .search-box .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px;z-index:1;pointer-events:none}
  .filter-scroll-wrapper{display:flex!important;flex-wrap:nowrap;align-items:center;gap:6px;overflow:visible!important;flex-shrink:0}
  .filter-scroll-wrapper .filter-row{display:contents}
  .filter-scroll-wrapper .filter-row > *{flex-shrink:0}
  .filter-scroll-wrapper .filter-row span[style*="flex:1"]{display:none}
  select,input[type=date],input[type=number]{height:36px;box-sizing:border-box}
  .filter-toggle-btn{display:none!important}
}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:8px 12px 8px 34px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px}
select,input[type=date]{padding:7px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;outline:none;cursor:pointer}
.btn{padding:7px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:12px;white-space:nowrap;transition:all .15s;font-weight:500}
.btn:hover{border-color:var(--accent);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2563eb}
.btn.success{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface);border-color:var(--border)}
/* ═══ Tab Bar ═══ */
.container{max-width:1400px;margin:0 auto;padding:0 24px 24px}
.tab-bar{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab-btn{padding:8px 20px;border:none;background:transparent;color:var(--dim);cursor:pointer;font-size:13px;font-weight:600;border-bottom:2px solid transparent;transition:all .15s}
.tab-btn.active,.tab-btn:hover{color:#fff;border-bottom-color:var(--accent)}
.tab-btn .badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;font-size:10px;background:var(--surface);color:var(--dim)}
.tab-btn.active .badge{background:var(--accent);color:#fff}
/* ═══ Table ═══ */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:800px}
thead th{background:var(--surface);padding:10px 12px;text-align:left;font-weight:600;color:var(--muted);border-bottom:2px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:#fff}
thead th.w32{width:32px;text-align:center}
thead th.w60{width:60px}
thead th.w80{width:80px}
thead th.w100{width:100px}
thead th.w120{width:120px}
thead th[onclick]{padding-right:18px;position:relative}
thead th[onclick]::before{content:'▴';position:absolute;right:4px;top:5px;font-size:11px;line-height:1;opacity:.3;pointer-events:none}
thead th[onclick]::after{content:'▾';position:absolute;right:4px;top:13px;font-size:11px;line-height:1;opacity:.3;pointer-events:none}
thead th.sort-asc::before{opacity:1;color:var(--accent)}
thead th.sort-asc::after{opacity:.3}
thead th.sort-desc::after{opacity:1;color:var(--accent)}
thead th.sort-desc::before{opacity:.3}
tbody td{padding:10px 12px;border-bottom:1px solid rgba(51,65,85,.4);vertical-align:middle}
tbody tr{transition:background .1s}
tbody tr:hover{background:rgba(59,130,246,.06)}
td.title-cell{max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.title-cell a{color:var(--text);text-decoration:none}
td.title-cell a:hover{color:var(--accent)}
.score-bar{display:inline-block;height:6px;border-radius:3px;min-width:4px;vertical-align:middle;margin-right:6px}
.score-hi{background:var(--green);width:100%} .score-mid{background:var(--amber);width:60%} .score-lo{background:var(--dim);width:35%}
.tag-sm{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;white-space:nowrap}
.tag-blue{background:rgba(59,130,246,.2);color:#60a5fa}
.tag-amber{background:rgba(245,158,11,.2);color:#fbbf24}
.tag-green{background:rgba(16,185,129,.2);color:#34d399}
.tag-gray{background:rgba(100,116,139,.2);color:#94a3b8}
.link-btn{color:var(--accent);text-decoration:none;font-size:12px;font-weight:500}
.link-btn:hover{text-decoration:underline}
.star{cursor:pointer;font-size:15px;user-select:none;color:var(--dim);transition:all .15s}
.star.on{color:#f59e0b}
.new-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:700;color:#fff;background:var(--red);margin-right:6px;vertical-align:middle;line-height:1.5}
/* ═══ Pagination ═══ */
.pg-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:12px;color:var(--muted)}
.pg-btns{display:flex;gap:4px}
.pg-btn{min-width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:12px;transition:all .15s}
.pg-btn:hover{border-color:var(--accent);color:#fff}
.pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pg-btn:disabled{opacity:.3;cursor:default}
/* ═══ Trend / Competitor ═══ */
.trend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:16px}
.trend-card{background:var(--surface);border-radius:var(--radius);padding:16px;border:1px solid var(--border)}
.trend-card h3{font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:600}
/* ═══ Footer ═══ */
.app-footer{text-align:center;padding:20px;color:var(--dim);font-size:11px;border-top:1px solid var(--border);margin-top:32px}
.app-footer a{color:var(--dim);text-decoration:none}
.app-footer a:hover{color:var(--muted)}
/* ═══ Mobile ═══ */
@media(max-width:768px){
/* ── Viewport constraint — prevent horizontal scroll ── */
body{overflow-x:hidden}
.stats-row,.filter-bar,.container,.app-header,.tab-bar{max-width:100vw!important;width:100%!important;box-sizing:border-box}
.stats-row{grid-template-columns:repeat(2,1fr);padding:12px 16px;gap:8px}
.filter-bar,.container{padding:0 12px 12px}
tbody td{padding:8px 6px;font-size:12px}
.hide-mobile{display:none}
/* ── Card layout — Twitter-style ── */
table{min-width:0!important;width:100%!important}
.table-wrap{overflow-x:visible!important}
thead{display:none}
tbody tr.data-row{display:grid;grid-template-columns:1fr auto;width:100%;max-width:100%;box-sizing:border-box;padding:16px 16px 14px;margin-bottom:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;position:relative;gap:8px 12px}
/* Hide desktop cells */
td:nth-child(1),td:nth-child(2),td:nth-child(5),td:nth-child(6),td:nth-child(9){display:none!important}
/* Score pill — row 1, col 1 */
td:nth-child(3){display:flex!important;align-items:center;gap:8px;font-size:14px;font-weight:700;white-space:nowrap;padding:0}
td:nth-child(3) .score-bar{height:10px;border-radius:5px;min-width:40px}
/* Title — row 2, full width */
td.title-cell{grid-column:1/-1;grid-row:2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:600;font-size:15px;line-height:1.5;white-space:normal;padding:0;padding-right:32px!important;color:var(--text)}
td.title-cell a{font-size:inherit;line-height:inherit;color:var(--text)}
td.title-cell .new-badge{vertical-align:middle;margin-right:4px}
/* Budget — row 3, col 1 */
td:nth-child(7){grid-row:3;grid-column:1;display:flex!important;align-items:center;font-size:13px;font-weight:600;color:var(--green);white-space:nowrap;padding:0}
/* Region — row 3, col 2 */
td:nth-child(8){grid-row:3;grid-column:2;display:flex!important;align-items:center;justify-content:flex-end;font-size:13px;color:var(--muted);white-space:nowrap;padding:0}
/* Date — row 4, col 1 */
td:nth-child(10){grid-row:4;grid-column:1;display:flex!important;align-items:center;font-size:12px;color:var(--dim);white-space:nowrap;padding:0}
/* Actions — row 5, full width bottom bar */
td:nth-child(11){grid-row:5;grid-column:1/-1;display:flex!important;align-items:center;justify-content:flex-end;gap:8px;padding:8px 0 0!important;border-top:1px solid var(--border);margin-top:4px}
td:nth-child(11) .link-btn{font-size:13px;padding:5px 12px;border-radius:16px;background:var(--accent);color:#fff!important;text-decoration:none;font-weight:500}
td:nth-child(11) .star{font-size:18px;margin-right:2px}
/* Kebab button */
.kebab-btn{position:absolute;top:10px;right:10px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:16px;color:var(--dim);cursor:pointer;z-index:2;transition:all .15s;line-height:1;user-select:none}
.kebab-btn:active{background:var(--border);color:var(--text)}
/* Kebab dropdown */
.kebab-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.35);z-index:10000;min-width:160px;padding:6px;animation:kebabIn .15s ease}
.kebab-menu button{display:block;width:100%;padding:10px 14px;border:none;background:transparent;color:var(--text);font-size:14px;text-align:left;cursor:pointer;border-radius:8px;transition:background .1s}
.kebab-menu button:active{background:var(--border)}
.kebab-overlay{position:fixed;inset:0;z-index:9999;background:transparent}
@keyframes kebabIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
tr.empty-msg{display:flex!important;justify-content:center;padding:48px 20px!important;background:var(--surface)!important;border-radius:14px!important}
tr.detail-row{display:block!important}
/* ── Search box: modern pill design ── */
.search-row{display:flex;align-items:center;gap:12px;width:100%}
.search-box{display:flex;align-items:center;flex:1;position:relative;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);overflow:hidden;transition:all .3s ease}
.search-box:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(59,130,246,.15)}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.15),0 4px 16px rgba(59,130,246,.1)}
.search-box input{flex:1;height:48px;padding:0 12px 0 44px;font-size:15px;border:none;background:transparent;color:var(--text);outline:none;min-width:0;transition:color .2s}
.search-box input::placeholder{color:var(--dim);font-weight:400}
.search-box .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--dim);z-index:1;pointer-events:none;transition:color .2s}
.search-box:focus-within .search-icon{color:var(--accent)}
.search-btn{flex-shrink:0;height:48px;padding:0 24px;font-size:15px;font-weight:500;border:none;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap;transition:all .3s ease}
.search-btn:hover{background:#1d4ed8;transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.35)}
.search-btn:active{transform:translateY(0);box-shadow:0 2px 6px rgba(37,99,235,.25)}
/* ── Filter toggle button ── */
.filter-toggle-btn{display:flex;align-items:center;gap:4px;height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .2s}
.filter-toggle-btn:active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-toggle-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
body.light .filter-toggle-btn{background:#fff;border-color:#cbd5e1;color:#334155}
body.light .filter-toggle-btn:active,body.light .filter-toggle-btn.active{background:#2563eb;color:#fff;border-color:#2563eb}

#btnBackTop{position:fixed;bottom:80px;right:16px;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;z-index:999;opacity:0;transform:translateY(20px);transition:all .3s ease;pointer-events:none;box-shadow:0 2px 12px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
#btnBackTop.show{opacity:1;transform:translateY(0);pointer-events:auto}
body.light #btnBackTop{background:#fff;border-color:#e2e8f0;box-shadow:0 2px 12px rgba(0,0,0,.1)}

.filter-scroll-wrapper{display:none;margin-top:10px}
.filter-scroll-wrapper.expanded{display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:10px;position:relative;-webkit-mask-image:linear-gradient(to right,black 85%,transparent 100%);mask-image:linear-gradient(to right,black 85%,transparent 100%);animation:filterSlideDown .25s ease}
.filter-scroll-wrapper::-webkit-scrollbar{display:none}
.filter-scroll-wrapper .filter-row{display:contents}
.filter-scroll-wrapper .filter-row > *{flex-shrink:0}
.filter-row span[style*="flex:1"]{display:none!important}
/* ── Filter pill style ── */
.filter-scroll-wrapper select,.filter-scroll-wrapper input[type=date],.filter-scroll-wrapper input[type=number]{height:38px;border-radius:19px;background:var(--surface);border:1px solid var(--border);font-size:13px;padding:0 14px;flex-shrink:0;color:var(--text);white-space:nowrap}
body.light .filter-scroll-wrapper select,body.light .filter-scroll-wrapper input[type=date],body.light .filter-scroll-wrapper input[type=number]{background:#e8e8ed;border:none}
@keyframes filterSlideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}

    'Hiragino Sans GB', Roboto, sans-serif;

  --transition-normal: 0.2s ease;
  --transition-slow: 0.3s ease;

  --z-confirm: 1150;
